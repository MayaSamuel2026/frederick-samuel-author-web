name: frederick-samuel-author-web one-time verified merged-branch pruning
on:
  push:
    branches: [backup/verified-full-history-20261015]
    paths: [.github/workflows/frederick-samuel-author-web-one-time-merged-branch-cleanup-20261015.yml]
permissions:
  contents: write
  pull-requests: read
  actions: read
jobs:
  verified-prune:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify full Git mirror and strictly allowlisted merged branch identities
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,urllib.parse
          repo='MayaSamuel2026/frederick-samuel-author-web'
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF_NAME']=='backup/verified-full-history-20261015'
          token=os.environ['GH_TOKEN']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'NOEVA-Verified-Branch-Cleanup'}
          base='https://api.github.com/repos/'+repo
          targets=json.loads('''{"bookauthor/tranche-c1-historical-research-frontier":["376db7e2d589bb3eef7a84eb88f4cf3a1c586fc0",6],"bookauthor/tranche-c-specialist-studio-v1":["87123c061c24aa6c544c1d60e4ee1d438a1c2353",5],"bookauthor/tranche-b-authoring-loop-v1":["48b6f22dbefcba9a98ede1ecff5fc6b983416285",4],"consolidate/tranche-a-qualified-20260923":["939866b971d914121a2736918782ffb5e1e08330",3],"fix/import-library-actions-20260923":["5c7176d41d88b8909e6473dbc947083aa06200e3",1]}''')
          preserve=json.loads('''{"main":"8bd5317b48ccc1bd0eb4e806f6d05ab3fd5e6212","production":"c518e7d90460a284de0400c4b23819837c69ebfd","recovery/pre-core-retirement-20261015":"78b0b4d1c803ec8414d8dfb0639cd89047c94227"}''')
          assert targets and not set(targets)&set(preserve)
          assert all(not name.startswith(('backup/','recovery/','rollback')) for name in targets)
          def api(path,method='GET',missing=False):
            req=urllib.request.Request(base+path,headers=headers,method=method)
            try:
              with urllib.request.urlopen(req,timeout=25) as r:
                raw=r.read()
                return json.loads(raw) if raw else {}
            except urllib.error.HTTPError as e:
              if e.code==404 and missing:return None
              raise RuntimeError(f'{method} {path}: HTTP {e.code}') from e
          def ref(name,missing=False):
            return api('/git/ref/heads/'+urllib.parse.quote(name,safe='/'),missing=missing)
          run=api('/actions/runs/38762026098')
          artifact=api('/actions/artifacts/11986546167')
          assert run['status']=='completed' and run['conclusion']=='success'
          assert artifact['name']=='frederick-samuel-author-web-verified-git-mirror-20261015' and not artifact['expired']
          assert artifact['workflow_run']['id']==38762026098
          print('RESTORABLE_GIT_MIRROR=VERIFIED',flush=True)
          for name,sha in preserve.items():
            actual=ref(name)
            assert actual and actual['object']['sha']==sha,f'protected source changed: {name}'
          opens=api('/pulls?state=open&per_page=100')
          assert len(opens)<100,'open-PR pagination not checked'
          busy={p['head']['ref'] for p in opens if p.get('head')}|{p['base']['ref'] for p in opens if p.get('base')}
          assert not set(targets)&busy,'target referenced by open PR'
          for name,(sha,pr_id) in targets.items():
            pr=api('/pulls/'+str(pr_id))
            assert pr['head']['ref']==name and pr['merged_at'] and pr['state']=='closed',f'PR identity mismatch: {name}'
            actual=ref(name,missing=True)
            if actual is None:continue
            assert actual['object']['sha']==sha,f'branch updated since audit: {name}'
          print('ALL_TARGETS_VALIDATED='+str(len(targets)),flush=True)
          deleted=0
          for name,(sha,pr_id) in targets.items():
            actual=ref(name,missing=True)
            if actual is None:
              print('ALREADY_ABSENT='+name,flush=True)
              continue
            assert actual['object']['sha']==sha,f'branch moved before deletion: {name}'
            api('/git/refs/heads/'+urllib.parse.quote(name,safe='/'),method='DELETE')
            assert ref(name,missing=True) is None,f'deletion not reflected: {name}'
            deleted+=1
            print('DELETED='+name,flush=True)
          for name,sha in preserve.items():
            assert ref(name)['object']['sha']==sha,f'preserved source unexpectedly changed: {name}'
          print('DELETED_VERIFIED='+str(deleted),flush=True)
          print('PRODUCTION_AND_ACTIVE_REFS_PRESERVED=PASS',flush=True)
          PY
