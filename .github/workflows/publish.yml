name: Qualify and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frederick-samuel-production
  cancel-in-progress: true

jobs:
  qualify-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble release
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY="$RUNNER_TEMP/deploy"
          rm -rf "$DEPLOY"
          mkdir -p "$DEPLOY"

          # Reuse the last qualified release after the first deployment.
          if git ls-remote --exit-code --heads origin production >/dev/null 2>&1; then
            git fetch origin production:refs/remotes/origin/production
            git archive origin/production | tar -x -C "$DEPLOY"
          else
            # One-time bootstrap from the site that is already live on Hostinger.
            mkdir -p "$DEPLOY/books" "$DEPLOY/assets/covers"
            curl --fail --location --retry 3 --silent --show-error \
              "https://fredericksamuel.com/index.html" -o "$DEPLOY/index.html"
            books=(
              a-thread-of-stars before-the-tides by-blood-ink-and-salt crashing-waves
              crimson-horizons crimson-maelstrom emergent-tides storms-of-dominion
              surging-currents the-gustav-sonata the-hadal-horizons the-listening-tide
              the-quiet-blade the-silent-protocol the-snowblind-protocol the-weavers-debt
              thrindle verdant-ascension
            )
            for slug in "${books[@]}"; do
              curl --fail --location --retry 3 --silent --show-error \
                "https://fredericksamuel.com/books/$slug.html" -o "$DEPLOY/books/$slug.html"
              curl --fail --location --retry 3 --silent --show-error \
                "https://fredericksamuel.com/assets/covers/$slug.webp" -o "$DEPLOY/assets/covers/$slug.webp"
            done
          fi

          # Apply repository-controlled refinements and changed/new assets.
          python3 patches/apply.py "$DEPLOY"
          if [ -d site ]; then
            cp -a site/. "$DEPLOY/"
          fi
          python3 patches/snow_cover.py "$DEPLOY"

          # Rebuild only fully qualified approved covers from repository-safe source chunks.
          mkdir -p "$DEPLOY/assets/covers"
          cat \
            cover-source/the-listening-tide.001.b64 \
            cover-source/the-listening-tide.002.b64 \
            cover-source/the-listening-tide.003a.b64 \
            cover-source/the-listening-tide.003b.b64 \
            cover-source/the-listening-tide.004.b64 \
            | tr -d '\n\r' | base64 --decode > "$DEPLOY/assets/covers/the-listening-tide.webp"

          cat \
            cover-source/verdant-ascension.001.b64 \
            cover-source/verdant-ascension.002.b64 \
            cover-source/verdant-ascension.003.b64 \
            cover-source/verdant-ascension.004.b64 \
            cover-source/verdant-ascension.005.b64 \
            | tr -d '\n\r' | base64 --decode > "$DEPLOY/assets/covers/verdant-ascension.webp"

          test "$(sha256sum "$DEPLOY/assets/covers/the-listening-tide.webp" | cut -d' ' -f1)" = "3f8c2aa844be30e5f3ae4979e9ca39baebbc5afd48ddf67373353f42fdec72ea"
          test "$(sha256sum "$DEPLOY/assets/covers/verdant-ascension.webp" | cut -d' ' -f1)" = "f377afa6d458e53af07a3a8ce1f423ecf0827f1ab2b68f6b4977e93430e264da"

          # Apply final responsive corrections after all approved cover assets exist.
          python3 patches/mobile_fix.py "$DEPLOY"

          # Add technical SEO, crawl discovery and agent-facing visibility assets.
          python3 patches/seo_visibility.py "$DEPLOY"

          printf '%s\n' "Frederick Samuel Author Website — automated production release V6.3" > "$DEPLOY/VERSION.txt"

      - name: Qualify static site
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY="$RUNNER_TEMP/deploy"
          python3 - "$DEPLOY" <<'PY'
          import glob, os, re, sys
          root=sys.argv[1]
          for p in ['index.html','books','assets/covers','for-agents.html','robots.txt','sitemap.xml']:
              if not os.path.exists(os.path.join(root,p)):
                  raise SystemExit(f'Missing required path: {p}')
          books=glob.glob(os.path.join(root,'books','*.html'))
          covers=glob.glob(os.path.join(root,'assets','covers','*.webp'))
          if len(books)!=18: raise SystemExit(f'Expected 18 book pages, found {len(books)}')
          if len(covers)!=18: raise SystemExit(f'Expected 18 WebP covers, found {len(covers)}')
          missing=[]
          for hp in [os.path.join(root,'index.html')]+books:
              text=open(hp,encoding='utf-8').read()
              base=os.path.dirname(hp)
              for ref in re.findall(r'(?:src|href)="([^"]+)"', text):
                  if ref.startswith(('http://','https://','#','mailto:','javascript:')): continue
                  clean=ref.split('#',1)[0].split('?',1)[0]
                  if not clean: continue
                  target=os.path.normpath(os.path.join(base,clean))
                  if not os.path.exists(target): missing.append((os.path.relpath(hp,root),ref))
          if missing: raise SystemExit('Broken local references: '+repr(missing[:20]))
          if '.avif' in open(os.path.join(root,'index.html'),encoding='utf-8').read():
              raise SystemExit('AVIF reference remained in homepage')
          homepage=open(os.path.join(root,'index.html'),encoding='utf-8').read()
          if 'assets/covers/the-snowblind-protocol.webp' in homepage:
              raise SystemExit('Legacy Snowblind cover URL remained in homepage')
          if 'assets/covers/what-the-snow-remembers.webp' not in homepage:
              raise SystemExit('What The Snow Remembers cover URL missing from homepage')
          if 'What The Snow Remembers' not in homepage:
              raise SystemExit('What The Snow Remembers title missing from homepage')
          # Mobile release contract: every page must contain the responsive layer and safe viewport.
          html_pages=[os.path.join(root,'index.html'),os.path.join(root,'for-agents.html')]+books
          for hp in html_pages:
              text=open(hp,encoding='utf-8').read()
              if '/* MOBILE-V6 responsive qualification */' not in text:
                  raise SystemExit(f'Mobile responsive layer missing: {os.path.relpath(hp,root)}')
              if '/* MOBILE-V6.1 corrective pass */' not in text:
                  raise SystemExit(f'Mobile V6.1 corrective layer missing: {os.path.relpath(hp,root)}')
              if '/* MOBILE-V6.2 mobile Hadal sequence correction */' not in text:
                  raise SystemExit(f'Mobile V6.2 Hadal correction missing: {os.path.relpath(hp,root)}')
              if 'viewport-fit=cover' not in text:
                  raise SystemExit(f'Mobile viewport contract missing: {os.path.relpath(hp,root)}')
          if 'aria-controls="mobileNav"' not in homepage or 'aria-expanded="false"' not in homepage:
              raise SystemExit('Accessible mobile navigation contract missing')
          required_mobile_rules=[
              '.home .published-book:nth-child(even){',
              'grid-template-columns:minmax(0,1fr) !important;',
              '.home .hadal-latest-cover{',
              'width:min(100%,300px) !important;',
          ]
          for rule in required_mobile_rules:
              if rule not in homepage:
                  raise SystemExit(f'Mobile V6.1 regression guard missing: {rule}')
          if 'the-listening-tide.webp?v=mobile61-20260918' not in homepage:
              raise SystemExit('Listening Tide cache-busted asset reference missing')
          if 'verdant-ascension.webp?v=mobile61-20260918' not in homepage:
              raise SystemExit('Verdant Ascension cache-busted asset reference missing')
          if 'Frederick Samuel Author Website V6.3' not in homepage:
              raise SystemExit('V6.3 generator marker missing')
          if '.home .hadal-latest{display:none !important;}' not in homepage:
              raise SystemExit('Mobile Hadal duplicate feature is not suppressed')
          if '"/ width=' in homepage or '"/ height=' in homepage:
              raise SystemExit('Malformed responsive image tag detected')
          # SEO / Google discovery qualification.
          for hp in html_pages:
              text=open(hp,encoding='utf-8').read()
              rel=os.path.relpath(hp,root)
              for required in ['rel="canonical"','property="og:title"','name="twitter:card"','application/ld+json','name="robots"']:
                  if required not in text:
                      raise SystemExit(f'SEO marker {required} missing: {rel}')
          agents=open(os.path.join(root,'for-agents.html'),encoding='utf-8').read()
          if 'For agents &amp; publishers' not in agents or 'frederick@fredericksamuel.com' not in agents:
              raise SystemExit('Agent-facing page incomplete')
          if 'href="for-agents.html"' not in homepage:
              raise SystemExit('Homepage does not link to agent-facing page')
          robots=open(os.path.join(root,'robots.txt'),encoding='utf-8').read()
          if 'Sitemap: https://fredericksamuel.com/sitemap.xml' not in robots:
              raise SystemExit('robots.txt sitemap discovery missing')
          sitemap=open(os.path.join(root,'sitemap.xml'),encoding='utf-8').read()
          expected_urls=2+len(books)
          actual_urls=sitemap.count('<url>')
          if actual_urls != expected_urls:
              raise SystemExit(f'Sitemap expected {expected_urls} URLs, found {actual_urls}')
          for required_url in ['https://fredericksamuel.com/','https://fredericksamuel.com/for-agents.html','https://fredericksamuel.com/books/by-blood-ink-and-salt.html']:
              if f'<loc>{required_url}</loc>' not in sitemap:
                  raise SystemExit(f'Sitemap URL missing: {required_url}')
          print(f'QUALIFIED V6.3 VISIBILITY: {len(books)} book pages, {len(covers)} covers, SEO metadata, sitemap, robots and agent page passed')
          PY

      - name: Publish production branch
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY="$RUNNER_TEMP/deploy"
          cd "$DEPLOY"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -qm "Production deploy ${GITHUB_SHA}"
          git branch -M production
          git push --force origin production
